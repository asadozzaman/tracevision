[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracevision"
version = "0.1.0.dev0"
description = "Road-scene video intelligence with reproducible evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["build==1.3.0"]

[project.scripts]
tracevision = "tracevision.cli:main"

[project.urls]
Repository = "https://github.com/asadozzaman/tracevision"
Issues = "https://github.com/asadozzaman/tracevision/issues"

[tool.setuptools.packages.find]
where = ["src"]
